name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, unit & integration tests, build
    # The project targets Windows (Job Object sandbox, MinGW toolchain, Edge for PDF reports).
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (server + client)
        run: npm run typecheck

      # Ollama is not installed on the runner, so tests/ollama-live.test.ts skips itself;
      # no AI model is ever downloaded in CI.
      - name: Server tests
        run: npm test -w server

      - name: Client tests
        run: npm test -w client

      - name: Production build
        run: npm run build -w client

  e2e:
    name: End-to-end (Playwright, Microsoft Edge)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the Microsoft Edge that is preinstalled on the runner (channel: msedge),
      # so no browser download is needed.
      - name: Build client and run E2E
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.report
          retention-days: 7
