name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: constraints
    attributes:
      label: Project principles
      options:
        - label: Works offline / locally without paid services or mandatory cloud APIs
        - label: Does not send source code or personal data to external servers by default
